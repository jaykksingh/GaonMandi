name: CI

on:
  pull_request:
  push:
    branches: [main, development, qa]

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - name: Install native Postgres and PostGIS
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-postgis-3
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres WITH PASSWORD 'gm_local_only';"
          echo "TEST_DATABASE_ADMIN_URL=postgres://postgres:gm_local_only@localhost:5432/postgres" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm local:db && pnpm local:db
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;27.1.12297006"
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile:apk
      - run: pnpm mobile:apk-size
